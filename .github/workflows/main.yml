# .github/workflows/main.yml
name: Validate Radio Streams & Generate M3U

on:
  # Run the workflow daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
  # Also run on push to the main branch if the script file changes
  push:
    branches:
      - main
    paths:
      - 'generate_playlist.py'
      
jobs:
  generate-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        # Action to pull the code to the runner
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.x
        # Action to install Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 3. Install Python dependencies (requests library)
        # The script requires the 'requests' library for network operations
        run: pip install requests

      - name: 4. Run M3U generation script
        # Executes the script which creates 'working_stations.m3u'
        run: python generate_playlist.py
      
      - name: 5. Commit and push new playlist
        # Commits the generated file if its content has changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: working_stations.m3u
          commit_message: "Automated: Update working_stations.m3u after stream validation"
          commit_user_name: 'GitHub Actions Bot'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
